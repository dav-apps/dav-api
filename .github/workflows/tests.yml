name: Tests
on:
   push:
      branches: [dev, main, master, "test/**"]
   pull_request:
   workflow_dispatch:
permissions:
   contents: read
concurrency:
   group: tests-${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true
jobs:
   test:
      runs-on: ubuntu-24.04
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@v6
         - uses: actions/setup-node@v6
           with:
              node-version: 24
              cache: npm
         - name: Install dependencies
           run: npm ci
         - name: Generate Prisma client and build
           run: npm run build
         - name: Typecheck
           run: npm run typecheck
         - name: Unit, HTTP and adapter tests with coverage
           run: npm run test:coverage
         - name: Start isolated PostgreSQL and Redis
           run: npm run test:services:up
         - name: Integration tests
           run: npm run test:integration
         - name: Built server smoke tests
           run: npm run test:system
         - name: Upload coverage
           if: always()
           uses: actions/upload-artifact@v4
           with:
              name: coverage
              path: coverage/
              if-no-files-found: ignore
         - name: Test service logs on failure
           if: failure()
           run: docker compose -f compose.test.yml logs --no-color
         - name: Stop test services
           if: always()
           run: npm run test:services:down
